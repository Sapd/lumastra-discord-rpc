name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Tauri's bundler decides to code-sign based on whether APPLE_CERTIFICATE
      # is *defined*, not whether it is non-empty. Listing it under `env:` with
      # an unset secret therefore defines it as "" and sends the build down the
      # signing path, where `security import` fails on the empty certificate.
      #
      # So the variables must not exist at all unless there is a real value.
      # Exporting them through GITHUB_ENV only when the secret is present is
      # what achieves that — an `env:` block cannot omit a key conditionally.
      - name: Enable Apple signing
        id: signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning title=macOS unsigned::APPLE_CERTIFICATE is not set, so this .dmg will be UNSIGNED and un-notarized. Gatekeeper will block it on other machines. Set the six APPLE_* secrets to produce a signed build."
            exit 0
          fi
          echo "::notice title=macOS::Apple secrets present — the .dmg will be signed and notarized."
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Note Windows signing
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "::notice title=Windows::Windows builds are unsigned (no free publicly-trusted certificate). SmartScreen will warn on first run."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No APPLE_* keys here on purpose — see "Enable Apple signing" above.
          # They arrive via GITHUB_ENV, and only when a certificate exists.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lumastra Discord RPC ${{ github.ref_name }}'
          releaseDraft: true
          args: ${{ matrix.args }}
