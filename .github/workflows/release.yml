name: Release

on:
  push:
    tags: ['v*']

jobs:
  # Create the draft release ONCE, before the matrix fans out.
  #
  # Without this, each matrix job calls tauri-action independently and each
  # creates its own draft — GitHub allows duplicate drafts for one tag, because
  # a draft is not bound to its tag until published. The result is two releases
  # with the same tag, one holding the macOS artifacts and one the Windows ones,
  # and whichever you publish is missing half the downloads.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      # Tauri names its bundles from the app version in tauri.conf.json, NOT
      # from the git tag. Tagging v0.1.1 without bumping that version produces
      # a release full of artifacts labelled 0.1.0 — the build succeeds and the
      # mislabelling is only visible by reading the asset names. Fail loudly
      # instead.
      - name: Tag must match the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag  tauri.conf.json=$app  package.json=$pkg  Cargo.toml=$crate"
          fail=0
          for pair in "tauri.conf.json:$app" "package.json:$pkg" "Cargo.toml:$crate"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ "$val" != "$tag" ]; then
              echo "::error title=Version mismatch::$name is $val but the tag is v$tag. Bump it before tagging."
              fail=1
            fi
          done
          exit $fail

      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Lumastra Discord RPC ${tag}`,
              draft: true,
              generate_release_notes: true,
            })
            core.setOutput('release_id', data.id)
            core.notice(`Created draft release ${data.id} for ${tag}`)

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Tauri's bundler decides to code-sign based on whether APPLE_CERTIFICATE
      # is *defined*, not whether it is non-empty. Listing it under `env:` with
      # an unset secret therefore defines it as "" and sends the build down the
      # signing path, where `security import` fails on the empty certificate.
      #
      # So the variables must not exist at all unless there is a real value.
      # Exporting them through GITHUB_ENV only when the secret is present is
      # what achieves that — an `env:` block cannot omit a key conditionally.
      - name: Enable Apple signing
        id: signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning title=macOS unsigned::APPLE_CERTIFICATE is not set, so this .dmg will be UNSIGNED and un-notarized. Gatekeeper will block it on other machines. Set the six APPLE_* secrets to produce a signed build."
            exit 0
          fi
          echo "::notice title=macOS::Apple secrets present — the .dmg will be signed and notarized."
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Note Windows signing
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "::notice title=Windows::Windows builds are unsigned (no free publicly-trusted certificate). SmartScreen will warn on first run."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No APPLE_* keys here on purpose — see "Enable Apple signing" above.
          # They arrive via GITHUB_ENV, and only when a certificate exists.
        with:
          # Upload into the release create-release already made, rather than
          # creating one per matrix job.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # tauri-action only publishes the *bundles* (NSIS + MSI). The raw
      # executable built alongside them runs standalone — Tauri embeds the
      # frontend and WebView2 ships with Windows — so publish it for people who
      # would rather not run an installer.
      #
      # "Portable" here means no installer, NOT no footprint: it still keeps
      # config and tokens in %APPDATA%, exactly like the installed build.
      - name: Publish portable Windows executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          src="src-tauri/target/release/lumastra-discord-rpc.exe"
          if [ ! -f "$src" ]; then
            echo "::error title=Portable exe missing::Expected $src — the bundle step may have changed its output layout."
            exit 1
          fi
          out="Lumastra-Discord-RPC-${GITHUB_REF_NAME}-portable-x64.exe"
          cp "$src" "$out"
          gh release upload "$GITHUB_REF_NAME" "$out" --clobber --repo "$GITHUB_REPOSITORY"
