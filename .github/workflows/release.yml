name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Missing Apple secrets do not fail the build — tauri-action just skips
      # signing and emits an unsigned .dmg. That is the desired behaviour for
      # now, but it is also a trap: a release can look successful and ship
      # unsigned. Say which mode we are in, loudly, in the log.
      - name: Report signing mode
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" != "macos-latest" ]; then
            echo "::notice title=Windows::Windows builds are unsigned (no free publicly-trusted certificate). SmartScreen will warn."
          elif [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "::notice title=macOS::Apple secrets present — the .dmg will be signed and notarized."
          else
            echo "::warning title=macOS unsigned::APPLE_CERTIFICATE is not set, so this .dmg will be UNSIGNED and un-notarized. Gatekeeper will block it on other machines. Set the six APPLE_* secrets to sign."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset secrets are empty strings, which tauri-action treats as
          # "don't sign" rather than an error — see the notice step above.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lumastra Discord RPC ${{ github.ref_name }}'
          releaseDraft: true
          args: ${{ matrix.args }}
